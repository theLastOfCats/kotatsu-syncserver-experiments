[package]
name = "kotatsu-axum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kotatsu-axum"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
hex = "0.4"
jsonwebtoken = "10.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "mysql", "sqlite", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }
url = "2"
