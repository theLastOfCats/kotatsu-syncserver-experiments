[package]
name = "kotatsu-axum"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kotatsu-axum"
path = "src/main.rs"

[dependencies]
argon2 = "0.6"
axum = "0.8"
base64 = "0.23"
hex = "0.4"
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["any", "mysql-rsa", "sqlite", "runtime-tokio", "tls-rustls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["compression-gzip"] }
url = "2"
